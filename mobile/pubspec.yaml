name: visionassist_mobile
description: Accessibility-first Android app shell for VisionAssist.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  camera: 0.12.1
  flutter_tts: ^4.2.5
  flutter:
    sdk: flutter
  http: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  # camera 0.12.1 supports the CameraX implementation line that contains the
  # CallbackToFutureAdapter compile-classpath fix.
  camera_android_camerax: 0.7.4+8

flutter:
  uses-material-design: true